# JVM args for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
android.suppressUnsupportedCompileSdk=36

# P.R.I.S.M. Mobile notes:
# - This project targets Android 16 (API 36). The Android SDK must provide
#   platforms;android-36 and build-tools (any recent version, e.g. 35.0.0/36.0.0).
# - AGP 8.7.3 requires Gradle 8.9+ (this project uses the 8.11.1 wrapper).
# - AGP 8.7.x officially supports running the build on JDK 17 or JDK 21.
#   If your JAVA_HOME points to a newer or older JDK, set one of:
#     set JAVA_HOME=<JDK17-or-21>
#   or add to a local gradle.properties (not committed):
#     org.gradle.java.home=C\:\\path\\to\\jdk-21

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
